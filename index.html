<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>A Special Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe3e3 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #4a5568;
            touch-action: manipulation;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(244, 63, 94, 0.1);
            text-align: center;
            max-width: 360px;
            width: 85%;
            border: 2px solid #ffe3e3;
            z-index: 10;
        }

        h2 {
            color: #e11d48;
            margin-bottom: 10px;
            font-size: 1.5rem;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .emoji {
            font-size: 2.5rem;
            margin-bottom: 15px;
            display: block;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #fda4af;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 20px;
            outline: none;
            text-align: center;
            -webkit-appearance: none;
        }

        input[type="text"]:focus {
            border-color: #f43f5e;
        }

        button {
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #f43f5e;
            color: white;
            width: 100%;
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            width: 100%;
        }

        .btn-yes {
            background-color: #22c55e;
            color: white;
        }

        .no-wrapper {
            display: inline-block;
        }

        .btn-no {
            background-color: #ef4444;
            color: white;
            transition: left 0.1s ease-out, top 0.1s ease-out;
            z-index: 9999;
        }

        .love-gif {
            width: 100%;
            max-width: 250px;
            border-radius: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- NAME SCREEN -->
    <div id="screen-name" class="card">

        <span class="emoji">✨</span>

        <h2>Welcome</h2>

        <div class="subtitle">
            Please enter your name
        </div>

        <input
            type="text"
            id="user-name"
            placeholder="Enter your name..."
            autocomplete="off"
        >

        <button class="btn-submit" id="submit-btn">
            Continue
        </button>

    </div>


    <!-- QUESTION SCREEN -->
    <div id="screen-question" class="card hidden">

        <span class="emoji">💝</span>

        <h2 id="proposal-text" style="margin-bottom: 20px;"></h2>

        <div class="btn-container">

            <button class="btn-yes" id="yes-btn">
                YES
            </button>

            <div class="no-wrapper">
                <button class="btn-no" id="no-btn">
                    NO
                </button>
            </div>

        </div>

    </div>


    <!-- SUCCESS SCREEN -->
    <div id="screen-success" class="card hidden">

        <span class="emoji">🥰❤️</span>

        <h2 id="success-text" style="margin-bottom: 15px;"></h2>

        <img
            class="love-gif"
            src="cat-kiss.gif"
            alt="Cute Cats Kissing"
        >

    </div>


    <!-- SUPABASE JAVASCRIPT LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // ==========================================
        // SUPABASE CONNECTION
        // ==========================================

        const SUPABASE_URL =
            "https://qtqqmmzbsngkpqtmcnco.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable__TfzVA9rNETm6cck7lp63Q_awDTd4zI";


        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        // ==========================================
        // GET HTML ELEMENTS
        // ==========================================

        const screenName =
            document.getElementById('screen-name');

        const screenQuestion =
            document.getElementById('screen-question');

        const screenSuccess =
            document.getElementById('screen-success');


        const nameInput =
            document.getElementById('user-name');

        const submitBtn =
            document.getElementById('submit-btn');


        const proposalText =
            document.getElementById('proposal-text');

        const successText =
            document.getElementById('success-text');


        const yesBtn =
            document.getElementById('yes-btn');

        const noBtn =
            document.getElementById('no-btn');


        let savedName = "";


        // ==========================================
        // SAVE NAME TO SUPABASE
        // ==========================================

        submitBtn.addEventListener('click', async () => {

            savedName = nameInput.value.trim();


            // Check if name is empty
            if (savedName === "") {

                alert("Please enter a name first! 😉");

                return;
            }


            // Disable button while saving
            submitBtn.disabled = true;

            submitBtn.textContent = "Saving...";


            // Insert name into Supabase
            const { data, error } = await supabaseClient
                .from('names')
                .insert([
                    {
                        name: savedName
                    }
                ]);


            // Check for errors
            if (error) {

                console.error(
                    "Supabase error:",
                    error
                );

                alert(
                    "Could not save your name. Please try again."
                );

                submitBtn.disabled = false;

                submitBtn.textContent = "Continue";

                return;
            }


            // Name successfully saved
            console.log(
                "Name saved successfully!"
            );


            // Show question
            proposalText.textContent =
                `${savedName}, will you be forever mine? ❤️🌹`;


            screenName.classList.add('hidden');

            screenQuestion.classList.remove('hidden');

        });


        // ==========================================
        // MOVE NO BUTTON
        // ==========================================

        function floatNoButton() {

            const btnWidth =
                noBtn.offsetWidth || 80;

            const btnHeight =
                noBtn.offsetHeight || 50;


            const maxX =
                window.innerWidth - btnWidth;

            const maxY =
                window.innerHeight - btnHeight;


            const randomX =
                Math.floor(Math.random() * maxX);

            const randomY =
                Math.floor(Math.random() * maxY);


            noBtn.style.position = 'fixed';

            noBtn.style.left =
                `${randomX}px`;

            noBtn.style.top =
                `${randomY}px`;

        }


        // Desktop
        noBtn.addEventListener(
            'mouseenter',
            floatNoButton
        );


        // Mobile
        noBtn.addEventListener(
            'touchstart',
            (e) => {

                e.preventDefault();

                floatNoButton();

            }
        );


        // ==========================================
        // YES BUTTON
        // ==========================================

        yesBtn.addEventListener(
            'click',
            () => {

                successText.textContent =
                    `I love you too, ${savedName} ❤️`;


                screenQuestion.classList.add(
                    'hidden'
                );

                screenSuccess.classList.remove(
                    'hidden'
                );

            }
        );

    </script>

</body>
</html>
